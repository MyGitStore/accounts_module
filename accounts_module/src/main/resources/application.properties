spring.application.name=accounts_module
server.port=8081
#spring.security.enabled=false
#spring.security.user.name=none
#spring.security.user.password=none


springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/javadevdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect